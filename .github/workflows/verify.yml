name: Scientific verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - name: Reproduce the full notebook from a clean checkout
        run: python scripts/build_notebook.py --execute
      - run: python -m pytest -q
      - run: python scripts/verify_submission.py
